<div class="contact-container">
  <h2 class="contact-header">Get In Touch</h2>
  
  <p class="contact-info">
    Have questions or feedback? We'd love to hear from you. Fill out the form below and we'll get back to you as soon as possible.
  </p>
  
  <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
    <div class="input-group">
      <label for="name">Name</label>
      <input 
        type="text" 
        id="name" 
        name="name" 
        [(ngModel)]="name" 
        required 
        #nameInput="ngModel"
        placeholder="Your name">
      <div *ngIf="nameInput.invalid && nameInput.touched" class="error">
        Please enter your name
      </div>
    </div>

    <div class="input-group">
      <label for="email">Email</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        [(ngModel)]="email" 
        required 
        #emailInput="ngModel"
        placeholder="your.email@example.com">
      <div *ngIf="emailInput.invalid && emailInput.touched" class="error">
        Please enter a valid email address
      </div>
    </div>

    <div class="input-group">
      <label for="message">Message</label>
      <textarea 
        id="message" 
        name="message" 
        [(ngModel)]="message" 
        required 
        #messageInput="ngModel"
        placeholder="Your message here...">
      </textarea>
      <div *ngIf="messageInput.invalid && messageInput.touched" class="error">
        Please enter your message
      </div>
    </div>

    <button type="submit" [disabled]="contactForm.invalid">Send Message</button>
    
    <div class="contact-social">
      <a href="#" class="social-icon">f</a>
      <a href="#" class="social-icon">t</a>
      <a href="#" class="social-icon">in</a>
    </div>
  </form>
</div>

<div class="app-container">
  <!-- App Header -->
  <header class="app-header">
    <h1 class="app-title">{{title}}</h1>
  </header>

  <!-- Mobile Navigation -->
  <nav class="mobile-nav">
    <button class="menu-button" (click)="toggleMenu()">☰</button>
    <div class="mobile-menu" [class.open]="menuOpen">
      <a routerLink="/login">Login</a>
      <a routerLink="/about">About Us</a>
      <a routerLink="/contact">Contact</a>
    </div>
    <div class="backdrop" [class.open]="menuOpen" (click)="toggleMenu()"></div>
  </nav>

  <div class="container">
    <!-- Counter App -->
    <section class="section counter-container">
      <h2 class="section-title">Counter App</h2>
      <div>
        <h2 class="count">{{count}}</h2>
        <div class="counter-buttons">
          <button (click)="handleCount('mins')" class="btn bg-red">-</button>
          <button (click)="handleCount('reset')" class="btn bg-black">Reset</button>
          <button (click)="handleCount('plus')" class="btn bg-green">+</button>
        </div>
      </div>
    </section>

    <!-- To-Do List -->
    <section class="section todo-container">
      <h2 class="section-title">To-Do List</h2>
      <div class="todo-input">
        <input [(ngModel)]="task" type="text" placeholder="Enter new task">
        <button (click)="addTask()">Add</button>
      </div>

      <div *ngIf="taskList.length === 0" class="empty-state">
        <p>No tasks yet. Add your first task above!</p>
      </div>

      <div *ngFor="let task of taskList" class="task-list">
        <div class="task-id">{{task.id}}</div>
        <div class="task-content">{{task.task}}</div>
        <button (click)="deleteTask(task.id)" class="delete-btn">Delete</button>
      </div>
    </section>

    <!-- Routing Section -->
    <section class="section">
      <h2 class="section-title">App Screens</h2>
      <router-outlet></router-outlet>
    </section>
  </div>
</div>
